name: CI/CD

on:
  push:
    branches: [legal-v1]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint & test
    runs-on: ubuntu-latest

    env:
      DAGSHUB_USER_TOKEN: ${{ secrets.DAGSHUB_USER_TOKEN }}
      DAGSHUB_USER: shimaa83
      # Throwaway test database (same settings as docker-compose.yml)
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: legal_rag
      POSTGRES_USER: rag_user
      POSTGRES_PASSWORD: rag_password

    services:
      postgres:
        image: pgvector/pgvector:pg18-trixie
        # Authenticated pulls avoid Docker Hub's rate limit on shared runners.
        credentials:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          POSTGRES_DB: legal_rag
          POSTGRES_USER: rag_user
          POSTGRES_PASSWORD: rag_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag_user -d legal_rag"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      # Needs the DAGSHUB_USER_TOKEN repo secret (not available on PRs from forks;
      # without it the dataset tests are skipped by tests/conftest.py).
      - name: Build dataset (DVC pull + repro)
        if: env.DAGSHUB_USER_TOKEN != ''
        run: |
          REMOTE=$(uvx dvc remote default)
          uvx dvc remote modify --local "$REMOTE" auth basic
          uvx dvc remote modify --local "$REMOTE" user "$DAGSHUB_USER"
          uvx dvc remote modify --local "$REMOTE" password "$DAGSHUB_USER_TOKEN"
          uvx dvc pull data/raw/egyptian_civil_code.pdf
          uvx dvc repro

      - name: Enable pgvector extension
        run: >
          PGPASSWORD=$POSTGRES_PASSWORD psql -h localhost -U $POSTGRES_USER
          -d $POSTGRES_DB -c "CREATE EXTENSION IF NOT EXISTS vector;"

      # Ruff reports problems but never fails the pipeline.
      - name: Ruff lint
        continue-on-error: true
        run: uvx ruff check src

      - name: Ruff format check
        continue-on-error: true
        run: uvx ruff format --check src

      - name: Compile check
        run: uv run python -m compileall -q src

      - name: Tests
        run: |
          if [ -d tests ]; then
            uv run --with pytest pytest -q
          else
            echo "No tests/ directory, skipping."
          fi

  docker:
    name: Build & push image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # The base image (python:3.13-slim) also comes from Docker Hub.
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Push only from main / manual runs; PRs just verify that the image builds.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=maxname: CI/CD

on:
