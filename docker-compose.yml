
services:
  postgres:
    image: ghcr.io/shimaa83/rag-legal-db:${IMAGE_TAG:-legal-v1}
    build:
      context: .
      dockerfile: Dockerfile.db
    container_name: legal-rag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: legal_rag
      POSTGRES_USER: rag_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag_user -d legal_rag"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: ghcr.io/shimaa83/rag-legal-api:${IMAGE_TAG:-legal-v1}
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: legal-rag-api
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: legal_rag
      POSTGRES_USER: rag_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      OLLAMA_URL: http://host.docker.internal:11434/api/chat
      GENERATOR_MODEL: ${GENERATOR_MODEL:-qwen2.5:3b}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    container_name: legal-rag-prometheus
    restart: unless-stopped
    ports:
      - "9093:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - api

  grafana:
    image: grafana/grafana:latest
    container_name: legal-rag-grafana
    restart: unless-stopped
    ports:
      - "3003:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
